[project]
name = "hw5"
version = "1.0.0"
description = "AirLLM vs. Ollama evaluation pipeline — HW5"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Nagham", email = "naghammnsor@gmail.com" }]

dependencies = [
    "airllm>=0.9.0",
    "ollama>=0.2.0",
    "psutil>=5.9.0",
    "pynvml>=11.0.0",
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "accelerate>=0.30.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "pandas>=2.2.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "huggingface-hub>=0.22.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pandas-stubs>=2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hw5"]

[tool.ruff]
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["hw5"]

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=85"
markers = [
    "integration: tests that require external services (Ollama, HuggingFace)",
    "slow: tests that take more than 30 seconds",
]
